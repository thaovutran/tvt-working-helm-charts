mongodb:
  replicaCount: 1
  image:
    repository: mongo
    tag: latest
  service:
    type: ClusterIP
    port: 27017
  volumeMounts:
    - name: db-data
      mountPath: /data/db

mongoexp:
  replicaCount: 2
  image:
    repository: mongo-express
    tag: latest
  service:
    type: ClusterIP
    port: 8081
  volumeMounts:
    - name: my-custom-secret
      mountPath: /my-cusrt-file
  volumes:
    - name: my-custom-secret
      hostPath:
        path: /Users/thaovtran/my-cusrt-file

webapp:
  replicaCount: 2
  image:
    repository: thawtran/mandan-site
    tag: v0.3
  service:
    type: ClusterIP
    port: 8383
    targetPort: 3000

ingress:
  enabled: true
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  mongodbHost: mandandb.k8s.local
  webappHost: mandanweb.k8s.local
  tls:
    enabled: true
    secretName: "k8s-local-secret-tls"

configmap:
  mongodb_url: ""

secrets:
  mongodb:
    username: dXNlcm5hbWU=
    password: cGFzc3dvcmQ=
  mongoexp:
    username: dXNlcm5hbWU=
    password: cGFzc3dvcmQ=
  tls:
    crt: 
    key: 

persistence:
  enabled: true
  postfix: dbpvc
  accessMode: ReadWriteOnce
  size: 1Gi
  storageClass: ""
