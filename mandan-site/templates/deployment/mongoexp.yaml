apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mandan-site.fullname" . }}-mongoexp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mandan-site.labels" . | nindent 4 }}
    app.kubernetes.io/component: mongoexp
spec:
  replicas: {{ .Values.mongoexp.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "mandan-site.fullname" . }}-mongoexp
  template:
    metadata:
      labels:
        {{- include "mandan-site.labels" . | nindent 8 }}
        app: {{ include "mandan-site.fullname" . }}-mongoexp
        app.kubernetes.io/component: mongoexp
    spec:
      containers:
      - name: mongoexp
        image: "{{ .Values.mongoexp.image.repository }}:{{ .Values.mongoexp.image.tag }}"
        env:
        - name: ME_CONFIG_MONGODB_SERVER
          valueFrom:
            configMapKeyRef:
              name: {{ include "mandan-site.fullname" . }}-mongo-cfm
              key: mongodb_url
        - name: ME_CONFIG_MONGODB_ADMINUSERNAME
          valueFrom:
            secretKeyRef:
              name: {{ include "mandan-site.fullname" . }}-mongodb-secret
              key: mongodb-root-username
        - name: ME_CONFIG_MONGODB_ADMINPASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "mandan-site.fullname" . }}-mongodb-secret
              key: mongodb-root-password
        - name: ME_CONFIG_BASICAUTH_USERNAME
          valueFrom:
            secretKeyRef:
              name: {{ include "mandan-site.fullname" . }}-mongoexp-secret
              key: mongo-express-username
        - name: ME_CONFIG_BASICAUTH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "mandan-site.fullname" . }}-mongoexp-secret
              key: mongo-express-password
        ports:
        - containerPort: {{ .Values.mongoexp.service.port }}
        volumeMounts:
        {{- range .Values.mongoexp.volumeMounts }}
        - name: {{ .name }}
          mountPath: {{ .mountPath }}
        {{- end }}
      volumes:
      {{- range .Values.mongoexp.volumes }}
      - name: {{ .name }}
        hostPath:
          path: {{ .hostPath.path }}
      {{- end }}
