apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "mandan-site.fullname" . }}-test-connection"
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mandan-site.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test-success
spec:
  containers:
    - name: curl
      image: curlimages/curl
      # command: ['curl']
      # args: ['{{ include "mandan-site.fullname" . }}-webapp:{{ .Values.webapp.service.port }}']
      command: ['sh', '-c']
      args:
        - >
          curl -Is http://{{ include "mandan-site.fullname" . }}-webapp:{{ .Values.webapp.service.port }};
          if [ $? -eq 0 ]; then
            echo "[INFO] => Connection successful!";
          else
            echo "[ERROR] => Connection failed!!!!"; 
            exit 1;
          fi
  restartPolicy: Never
